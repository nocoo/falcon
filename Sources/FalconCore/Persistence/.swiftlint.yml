# One schema actor after helper extraction. SQL literals stay long because
# swift-format does not reflow them. Correctness rules stay inherited.
# Style budget only; not a coverage exclusion.

line_length:
  warning: 280
  error: 320
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

file_length:
  warning: 1200
  error: 1500
  ignore_comment_only_lines: true

type_body_length:
  warning: 800
  error: 1000

function_body_length:
  warning: 160
  error: 220

large_tuple:
  warning: 4
  error: 6
