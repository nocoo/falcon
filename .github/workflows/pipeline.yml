name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@9933a7461a312cfaac526ccc5907357a7e3f669a # v2026.25
    with:
      package-manager: bun
      runtime-version: "1.4.3"
      node-version: "26.12.1"
      install-policy: blocked
      working-directory: services/relay
      artifact-name: b1-relay-build
      artifact-path: services/relay/.cloudflare/output
      deploy-cli: cf
      cf-version: "1.0.0-beta.13"
      environment: production
      concurrency-group: deploy-falcon-production
      timeout-minutes: 20
      verify-command: |
        export FALCON_VERIFY_SHA="${{ github.sha }}"
        python3 "${GITHUB_WORKSPACE}/scripts/relay-verify-production.py"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
