name: Quality Slots

on:
  workflow_call:
    outputs:
      tested-sha:
        description: Commit SHA verified by quality gate
        value: ${{ jobs.z1-gate.outputs.tested-sha }}

env:
  BUN_VERSION: "1.4.3"
  NODE_VERSION: "26.12.1"
  CI: "true"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    defaults:
      run:
        working-directory: services/relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          working-directory: services/relay
          install-policy: blocked
      - run: GIT_SHA="$GITHUB_SHA" bun run typecheck
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    defaults:
      run:
        working-directory: services/relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          working-directory: services/relay
          install-policy: blocked
      - run: GIT_SHA="$GITHUB_SHA" bun run lint
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-swift-lint:
    name: "S2: Lint (Swift)"
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/swiftlint
          key: ${{ runner.os }}-swiftlint-0.65.1
      - name: Install verified SwiftLint
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/share/swiftlint"
          echo "${HOME}/.local/share/swiftlint" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/share/swiftlint:${PATH}"
          if ! command -v swiftlint >/dev/null || [ "$(swiftlint version)" != "0.65.1" ]; then
            curl -fsSL -o /tmp/swiftlint.zip \
              https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
            echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  /tmp/swiftlint.zip" | shasum -a 256 -c -
            rm -rf "${HOME}/.local/share/swiftlint"
            mkdir -p "${HOME}/.local/share/swiftlint"
            unzip -q /tmp/swiftlint.zip -d "${HOME}/.local/share/swiftlint"
          fi
          test "$(swiftlint version)" = "0.65.1"
      - name: Run SwiftLint and swift-format
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          set -euo pipefail
          export PATH="$DEVELOPER_DIR/usr/bin:$PATH"
          swiftlint lint --strict
          xcrun swift-format lint --strict --recursive Sources Tests
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          lockfiles: "services/relay/bun.lock"
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    defaults:
      run:
        working-directory: services/relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          working-directory: services/relay
          install-policy: blocked
      - run: GIT_SHA="$GITHUB_SHA" bun run build
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    defaults:
      run:
        working-directory: services/relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          working-directory: services/relay
          install-policy: blocked
      - run: GIT_SHA="$GITHUB_SHA" bun run test:coverage
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-relay:
    name: "L1: Unit (Relay)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          # Relay deploy & workflow helper tests only (no CI hook self-tests).
          python3 scripts/relay-verify-production.test.py
          python3 scripts/relay-workflow-contracts.test.py
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-native-swift:
    name: "L1: Unit (Swift)"
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore git commit mtimes
        run: |
          python3 - <<'PY'
          import os, subprocess
          files = {f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.decode().split("\0") if f}
          mtimes = {}
          out = subprocess.run(["git", "log", "--format=COMMIT:%ct", "--name-only"], capture_output=True, text=True, check=True).stdout
          cur_ts = None
          for line in out.splitlines():
              if line.startswith("COMMIT:"):
                  cur_ts = int(line[7:])
              elif line and line in files and line not in mtimes and cur_ts is not None:
                  mtimes[line] = cur_ts
                  if len(mtimes) == len(files):
                      break
          for f, ts in mtimes.items():
              if os.path.exists(f):
                  os.utime(f, (ts, ts))
          PY

      - name: Cache native CI tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin
            ~/.local/share/uv
            ~/.cache/uv
          key: ${{ runner.os }}-falcon-tools-uv0.13.1-sdk0.7.1

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-falcon-swift-v2-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-falcon-swift-v2-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            ${{ runner.os }}-falcon-swift-v2-

      - name: Install native CI tools
        run: |
          set -euo pipefail
          # Pin exact tool versions; install missing tools only on cache miss.
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/bin:${PATH}"
          if ! command -v uv >/dev/null || ! uv --version | grep -qF '0.13.1'; then
            curl -LsSf https://astral.sh/uv/0.13.1/install.sh | sh
          fi
          uv --version | tee /tmp/falcon-uv-version.txt
          grep -F '0.13.1' /tmp/falcon-uv-version.txt
          command -v uv

      - name: Run Swift tests, coverage, and SDK interop
        run: |
          set -euo pipefail
          export PATH="$DEVELOPER_DIR/usr/bin:$PATH"

          # Swift coverage gaps remain explicit; do not enforce a 95% Swift floor here.
          uv run --python 3.12.14 --no-project --with 'typesafe-sdk==0.7.1' bash -euo pipefail -s <<'BASH'
          export FALCON_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          swift test --enable-code-coverage
          BASH
          CODECOV_PATH="$(swift test --show-codecov-path)"
          if [ -f "$CODECOV_PATH" ]; then
            CODECOV_DIR="$(dirname "$CODECOV_PATH")"
          elif [ -d "$CODECOV_PATH" ]; then
            CODECOV_DIR="$CODECOV_PATH"
          else
            echo "::error::swift test --show-codecov-path returned missing path: $CODECOV_PATH"
            exit 1
          fi
          rm -rf build/verification/native-codecov
          mkdir -p build/verification
          cp -R "$CODECOV_DIR" build/verification/native-codecov

      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload native coverage artifact
        if: "!cancelled()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-codecov
          path: build/verification/native-codecov
          retention-days: 7
          if-no-files-found: error

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - Covered by L1 and L3"

  l3-integration:
    name: "L3: Integration"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    defaults:
      run:
        working-directory: services/relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          working-directory: services/relay
          install-policy: blocked
      - run: GIT_SHA="$GITHUB_SHA" bun run test:http
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e:
    name: "L4: E2E"
    if: ${{ vars.ENABLE_L4_E2E == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - Native macOS UI journeys are manual L4"

  p1-package:
    name: "P1: Package"
    if: ${{ vars.ENABLE_P1_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - Private Worker service"

  z1-gate:
    name: "Z1: Gate"
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s2-swift-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l1-relay
      - l1-native-swift
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.gate.outputs.tested-sha }}
    steps:
      - name: Validate all quality slots and tested SHAs
        id: gate
        uses: nocoo/base-ci/.github/actions/z1-gate@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          needs-json: ${{ toJSON(needs) }}
          expected-sha: ${{ github.sha }}
          required-jobs: |
            s1-types
            s2-lint
            s2-swift-lint
            s3-workflow
            g1-secrets
            g2-dependencies
            b1-build
            l1-unit
            l1-relay
            l1-native-swift
            l3-integration
          skipped-jobs: |
            l2-runtime
            l4-e2e
            p1-package
