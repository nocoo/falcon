# CI slot standard v1 (nocoo/base-ci docs/slots.md): S1, S2, S3, G1, G2, B1, L1, L2, Z1 via quality-slots.yml;
# na L3, L4, P1 in slot-status. nocoo/base-ci v2026.16.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/quality-slots.yml
