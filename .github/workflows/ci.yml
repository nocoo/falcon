# CI slot standard v1 (nocoo/base-ci docs/slots.md): Worker impl S1, S2, S3, G1, G2, B1, L1, L2, Z1 via quality.yml;
# na L1.5, L3, P1 in slot-status. macOS Swift L1/S2 与 relay helpers 为槽外作业（见 PR）。nocoo/base-ci v2026.12.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      package-manager: bun
      runtime-version: "1.4.3"
      node-version: "26.12.1"
      install-policy: blocked
      working-directory: services/relay
      typecheck: true
      lint: true
      unit: true
      security: true
      typecheck-command: GIT_SHA="$GITHUB_SHA" bun run typecheck
      lint-command: GIT_SHA="$GITHUB_SHA" bun run lint
      test-command: GIT_SHA="$GITHUB_SHA" bun run test:coverage
      build: true
      build-command: GIT_SHA="$GITHUB_SHA" bun run build
      l2: true
      l2-command: GIT_SHA="$GITHUB_SHA" bun run test:http
      coverage-path: services/relay/coverage
      lockfiles: bun.lock
      security-command: |
        gitleaks detect --no-banner --verbose --redact --no-git --source="${GITHUB_WORKSPACE}"
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "Worker 运行时（miniflare）已并入 L1 vitest test:coverage，无独立 L1.5 命令"},
        "L2": {"status": "impl"},
        "L3": {"status": "na", "reason": "CI 未接 Playwright；原生 UI 旅程为 manual L3"},
        "P1": {"status": "na", "reason": "services/relay package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}

  helpers:
    name: Relay helper contracts
    uses: nocoo/base-ci/.github/workflows/test-job.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runner: ubuntu-latest
      runtime: none
      timeout-minutes: 10
      command: |
        set -euo pipefail
        # Stdlib helper checks only. Worker TS coverage remains the sole 95% claim.
        bash -n scripts/relay-bootstrap-hooks.sh
        bash -n .husky/pre-commit
        for test in scripts/relay-*.test.py; do
          python3 "$test"
        done

  l1-native-swift:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      slot-label: "L1: Unit Tests & Coverage"
      runner: macos-latest
      runtime: none
      timeout-minutes: 45
      artifact-name: native-codecov
      artifact-path: build/verification/native-codecov
      pre-command: |
        set -euo pipefail
        # Pin exact tool versions; base-ci test-job has no brew-version adapter.
        curl -LsSf https://astral.sh/uv/0.13.1/install.sh | sh
        echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
        export PATH="${HOME}/.local/bin:${PATH}"
        uv --version | tee /tmp/falcon-uv-version.txt
        grep -F '0.13.1' /tmp/falcon-uv-version.txt
        curl -fsSL -o /tmp/swiftlint.zip \
          https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
        echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  /tmp/swiftlint.zip" | shasum -a 256 -c -
        rm -rf /tmp/swiftlint-bin
        mkdir -p /tmp/swiftlint-bin
        unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint-bin
        echo "/tmp/swiftlint-bin" >> "$GITHUB_PATH"
        export PATH="/tmp/swiftlint-bin:${PATH}"
        test "$(swiftlint version)" = "0.65.1"
        command -v uv
        command -v swiftlint
      command: |
        set -euo pipefail
        export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
        export PATH="$DEVELOPER_DIR/usr/bin:$PATH"

        # Swift coverage gaps remain explicit; do not enforce a 95% Swift floor here.
        swift test --enable-code-coverage
        CODECOV_PATH="$(swift test --show-codecov-path)"
        if [ -f "$CODECOV_PATH" ]; then
          CODECOV_DIR="$(dirname "$CODECOV_PATH")"
        elif [ -d "$CODECOV_PATH" ]; then
          CODECOV_DIR="$CODECOV_PATH"
        else
          echo "::error::swift test --show-codecov-path returned missing path: $CODECOV_PATH"
          exit 1
        fi
        rm -rf build/verification/native-codecov
        mkdir -p build/verification
        cp -R "$CODECOV_DIR" build/verification/native-codecov
        scripts/check-sdk.sh
        swiftlint lint --strict
        xcrun swift-format lint --strict --recursive Sources Tests

  ci-gate:
    name: CI Gate
    if: always()
    needs: [quality, helpers, l1-native-swift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed on this commit
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          HELPERS_RESULT: ${{ needs.helpers.result }}
          NATIVE_RESULT: ${{ needs.l1-native-swift.result }}
          QUALITY_SHA: ${{ needs.quality.outputs.tested-sha }}
          HELPERS_SHA: ${{ needs.helpers.outputs.tested-sha }}
          NATIVE_SHA: ${{ needs.l1-native-swift.outputs.tested-sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success
          test "$HELPERS_RESULT" = success
          test "$NATIVE_RESULT" = success
          test -n "$QUALITY_SHA"
          test -n "$HELPERS_SHA"
          test -n "$NATIVE_SHA"
          test "$QUALITY_SHA" = "$EXPECTED_SHA"
          test "$HELPERS_SHA" = "$EXPECTED_SHA"
          test "$NATIVE_SHA" = "$EXPECTED_SHA"
          echo "Verified CI source ${EXPECTED_SHA}"
